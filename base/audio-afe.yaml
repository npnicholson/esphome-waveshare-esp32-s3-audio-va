###############################################################################
# Waveshare ESP32-S3-AUDIO-Board - AFE audio path (OPT-IN)
#
# The Espressif Audio Front End, built on esphome-audio-stack:
#
#   ES7210 4-ch TDM capture @ 48 kHz ──┬─ slot 0 ─┐
#                                      ├─ slot 2 ─┤ mics
#                                      └─ slot 1 ──┘ hardware playback reference
#                                             │
#                            esp_ae_rate_cvt (48 k -> 16 k, latency-coupled)
#                                             │
#            esp_afe: AEC + dual-mic Speech Enhancement/BSS + NS + VAD
#                                             │
#                          mono 16 kHz s16 -> ${mic_id} -> mWW / Assist
#
#   media / TTS -> resampler -> mixer (48 kHz mono) -> esp_audio_stack -> ES8311
#
# What this buys over base/audio-stock.yaml: the mic no longer hears the
# device's own speaker, so the wake word keeps working while music or TTS is
# playing (barge-in). Costs: more flash and PSRAM, a longer first build (the IDF
# component manager fetches esp-sr and esp-gmf), and a second DSP task pair.
#
# Codec I/O moves into esp_codec_dev inside esp_audio_stack, so there is no
# `i2s_audio`, `es7210`, `es8311` or hardware-sink `mixer` output here; the
# stock path's equivalents are in base/audio-stock.yaml.
#
# Contract with core.yaml - this file provides:
#   microphone  ${mic_id}                        (mWW, Assist, mute, diag)
#   speaker     announcement_resampling_speaker  (media_player announcements)
#   speaker     media_resampling_speaker         (media_player media)
#   speaker     media_mixing_input               (apply_ducking target)
#
# Your thin config MUST also set these core.yaml substitutions; see
# waveshare-va-afe.yaml for the block to copy:
#   mic_id, log_level, boot_chime_delay, va_volume_multiplier,
#   volume_min, volume_max
###############################################################################

# esp_audio_stack / esp_afe need a current ESPHome. This must be a literal, not
# a substitution: the remote-package loader parses esphome.min_version off the
# raw YAML before the substitution pass, so `${...}` here fails with
# "Not a valid version number".
esphome:
  min_version: 2026.6.5
  on_boot:
    # -200: after core.yaml's -100 block and after the number component has
    # restored, so a genuinely restored value is already in place and wins.
    - priority: -200
      then:
        - if:
            condition:
              lambda: 'return !id(mic_gain_default_applied);'
            then:
              - number.set:
                  id: mic_gain_digital
                  value: ${mic_gain_default}
              - lambda: id(mic_gain_default_applied) = true;
              - logger.log:
                  format: "[MIC] applied first-boot mic gain default: %s dB"
                  args: ['"${mic_gain_default}"']

substitutions:
  # ---------------------------------------------------------------------------
  # TDM SLOT MAP - flip these first if the AFE misbehaves on your board.
  #
  # Sources disagree about this board's slot map. These defaults follow the
  # esphome-intercom reference config for this exact board, which states the map
  # as verified on hardware (board oriented speaker-down, GPIO header up):
  #
  #   slot 0 = right microphone      slot 1 = playback (DAC) reference
  #   slot 2 = left microphone       slot 3 = near-silent / unused
  #
  # Conflicting claims, none of which is used here:
  #   - Our own docs/HARDWARE.md reads the schematic as MIC3 = AEC loopback,
  #     which would put the reference on slot 2.
  #   - esphome-audio-stack's own bring-up table lists this board under
  #     "tdm_ref_slot: 2 (Korvo-2 baseline)", contradicting the config above.
  #   - Waveshare's demo declares "RMNM", i.e. reference on slot 0.
  #
  # To settle it on hardware, watch the four "TDM slot N level" sensors below:
  # play music and the reference slot moves; speak and the mic slots move.
  # ---------------------------------------------------------------------------
  tdm_total_slots: '4'
  tdm_mic_slot_a: '0'       # right microphone
  tdm_mic_slot_b: '2'       # left microphone
  tdm_ref_slot: '1'         # playback (DAC) reference

  # Bus sample container. These are the defaults the board reference config
  # relies on (it omits both). esphome-audio-stack's generic TDM examples
  # instead show 32/32, so if capture is garbage rather than merely misrouted,
  # try bits_per_sample 32 with slot_bit_width 32 before anything else.
  tdm_bits_per_sample: '16'
  tdm_slot_bit_width: auto

  # Analog PGA applied by the ES7210 to every selected channel, including the
  # reference slot. If the AEC reference clips (echo gets worse under load),
  # trim it per-channel with codec.input.ref_channel / ref_gain_db rather than
  # lowering this and starving the mics.
  es7210_gain_db: '24.0'
  es7210_mic_selected: '0x0F'   # enable all four ADC channels; the TDM slots
                                # the reference rides on read zeros without it

  # Bottom of the ES8311 volume curve. The codec-dev default (~-50 dB) makes
  # this board's NS4150 path drop away far too fast; -30 dB keeps 0% as mute
  # while making 70% usable.
  master_volume_min_db: '-30.0'

  # AFE profile.
  #
  # `fd` (full duplex, NLP baked in for two-way speech) is what the board
  # reference config uses and what was qualified on this hardware - but that
  # device is a VA *and* a SIP intercom. This build is voice-assistant only,
  # and for that Espressif's `sr` profile is arguably the better fit: it uses a
  # linear AEC that preserves the spectrum micro_wake_word was trained on,
  # and esphome-audio-stack calls it "the right default for assistant devices".
  #
  # The default stays `fd` because it is the variant proven on this board. If
  # wake-word sensitivity under playback disappoints, switching to `sr` is the
  # first thing to try - see docs/AFE-BRINGUP.md.
  afe_type: fd

  # low_cost, NOT the reference config's high_perf. On this board high_perf does
  # not leave enough internal RAM for the rest of the firmware: the device boots
  # and the audio stack runs, but the Home Assistant API never finishes its
  # entity enumeration (HA connects, then disconnects after 60 s, forever) and
  # the encrypted handshake cannot complete at all. Confirmed on hardware.
  #
  # The reference config gets away with high_perf on a device with a different
  # entity set and network profile. Now that enable_high_performance is off and
  # the Wi-Fi pools are trimmed below, high_perf may be worth retrying - it is
  # the stronger AEC - but verify the API stays connected for several minutes
  # before keeping it.
  afe_mode: low_cost

  # Task layout, qualified under full load by the reference config. The audio
  # stack owns core 1 at priority 19; the AFE feed and fetch tasks must sit on
  # different cores (Espressif's own GMF guidance, to avoid an AFE task WDT).
  audio_task_core: '1'
  audio_task_priority: '19'
  afe_feed_task_core: '0'
  afe_fetch_task_core: '1'

  # Hardware-sink backlog. The ESPHome mixer transfers 50 ms chunks every 25 ms;
  # a long backlog here delays backpressure reaching the media/TTS decoders, so
  # keep it short rather than at the 500 ms the speaker platform defaults to.
  hw_speaker_buffer_duration: 128ms

  # Home Assistant hides `config` and `diagnostic` entities from the
  # auto-generated Overview dashboard - they only appear on the device page.
  # The TDM slot sensors are a bring-up instrument you need to watch live, so
  # they default to no category (plain sensors, visible on the dashboard). Set
  # this to `diagnostic` once the slot map is settled to tidy them away.
  slot_sensor_category: ''

  # Post-AFE digital mic gain applied on a device that has never had one set.
  # esp_audio_stack's mic_gain number has no `initial_value` in its schema - it
  # restores from flash if a preference exists and otherwise sits at 0 dB - so
  # the default is applied once from on_boot, guarded by a restored global. A
  # value you set later in HA persists and is never overridden.
  mic_gain_default: '15'

  # How long the amplifier stays powered after the speaker path goes idle.
  # Unlike the stock path (whose i2s speaker holds the line at silence with
  # `timeout: never`), the audio stack tears the speaker path down, so an amp
  # left enabled would amplify an undriven DAC line as hiss. A window long
  # enough to cover back-to-back sounds avoids per-sound clicking.
  amp_idle_delay: 30s

# Internal RAM is the binding constraint on this path, not flash. The TDM DMA
# rings alone take ~64 KB of DMA-capable internal heap at I2S start, which can
# leave under 30 KB free before micro_wake_word has even allocated. Moving the
# mWW task stack to PSRAM buys some of that back. This merges into the
# micro_wake_word block in core.yaml and does not affect the stock path.
micro_wake_word:
  task_stack_in_psram: true

# The speaker media_player calls network.require_high_performance_networking()
# (esphome/components/speaker/media_player/__init__.py), which expands lwIP to
# 65 KB TCP windows and 64-entry mailboxes. On the stock path there is internal
# RAM to spare for that. Here the TDM DMA rings and esp-sr have already taken
# most of it, and the result is that the TTS/media HTTP fetch cannot allocate:
#
#   E (79924) HTTP_CLIENT: Failed to allocate memory for host header
#   E (80012) http_utils: http_utils_assign_string(49): Memory exhausted
#
# The I2S sink can only drain ~96 KB/s anyway, so the big windows buy nothing
# here and cost the headroom that matters.
network:
  enable_high_performance: false

# Trim the Wi-Fi buffer pools for the same reason: bounded media/TTS ingress is
# wanted on this profile, so the audio graph sees backpressure before the final
# I2S sink saturates. Merges into the esp32 block in core.yaml; the stock path
# keeps ESPHome's defaults.
esp32:
  framework:
    sdkconfig_options:
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_TX_BA_WIN: "16"
      CONFIG_ESP_WIFI_RX_BA_WIN: "16"

external_components:
  # Pinned to a release tag, not @main, so a build is reproducible.
  - source: github://n-IA-hane/esphome-audio-stack@v2026.9.1
    components: [esp_audio_stack, esp_afe]

# -----------------------------------------------------------------------------
# The audio owner: I2S/TDM bus, both codecs, rate conversion, the AEC reference
# and the audio task. Replaces i2s_audio + es7210 + es8311 from the stock path.
#
# The bus runs at 48 kHz because the codecs are cleaner there (lower noise
# floor, better HF response for TTS), and only the mic/reference path is
# converted down to the 16 kHz that mWW, Assist and the AFE require. The
# conversion uses one multi-channel esp_ae_rate_cvt handle, so the latency
# between the mics and the reference stays coupled - which is what makes the
# hardware reference worth having.
# -----------------------------------------------------------------------------
esp_audio_stack:
  id: audio_stack
  processor_id: afe_processor

  i2s_mclk_pin: ${i2s_mclk}
  i2s_bclk_pin: ${i2s_bclk}
  i2s_lrclk_pin: ${i2s_lrclk}
  i2s_din_pin: ${i2s_din}
  i2s_dout_pin: ${i2s_dout}

  sample_rate: 48000            # physical bus + speaker rate
  output_sample_rate: 16000     # what the mic surface hands to mWW / Assist
  bits_per_sample: ${tdm_bits_per_sample}
  slot_bit_width: ${tdm_slot_bit_width}

  use_tdm_reference: true
  tdm_total_slots: ${tdm_total_slots}
  tdm_mic_slots:            # block form: "${" cannot open a YAML flow sequence
    - ${tdm_mic_slot_a}
    - ${tdm_mic_slot_b}
  tdm_ref_slot: ${tdm_ref_slot}

  codec:
    i2c_id: internal_i2c
    input:
      type: es7210
      address: 0x40
      mic_selected: ${es7210_mic_selected}
      gain_db: ${es7210_gain_db}
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true          # the reference comes from the TDM slot, not
                                # from ES8311 stereo DAC feedback

  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed

  master_volume_min_db: ${master_volume_min_db}

  task_core: ${audio_task_core}
  task_priority: ${audio_task_priority}
  task_stack_size: 8192

  # Keep contiguous internal/DMA heap for Wi-Fi, TLS, I2S DMA and esp-sr
  # internals; the audio frame buffers tolerate PSRAM latency.
  audio_task_stack_in_psram: true
  buffers_in_psram: true

  # Amp gating (TCA9555 EXIO8). core.yaml's media_player on_state also turns the
  # amp on, which is harmless and idempotent; the powerdown below is what the
  # stock path cannot do, because there the i2s speaker never stops driving.
  on_amplifier_required:
    - script.stop: amp_idle_powerdown
    - switch.turn_on: amp_enable
  on_amplifier_idle:
    - script.execute: amp_idle_powerdown

# -----------------------------------------------------------------------------
# The processor. `fd` (full duplex, NLP baked in) is the right type for a board
# whose mics and playback reference arrive in the same TDM frame.
#
# Speech Enhancement/BSS is structural on a dual-mic build - the component's own
# validator REFUSES `mic_num: 2` without `se_enabled: true`, because esp-sr
# otherwise falls back to first-mic-only. So it is not a switch.
#
# `ns_enabled: true` below is a request, not a guarantee: on a dual-mic build
# esp-sr's afe_config_check() prioritises BSS over noise suppression and may
# clear ns_init outright. Treat BSS as the thing actually cleaning up the
# signal, and NS as "on if esp-sr keeps it". That is also why NS is not exposed
# as a switch - it could not be honoured reliably.
#
# AGC stays off: it can help wake word under playback, but on this board it
# causes TTS/media stutter and toggling it needs a full AFE rebuild. AEC and VAD
# are the two knobs that are genuinely live.
# -----------------------------------------------------------------------------
esp_afe:
  id: afe_processor
  type: ${afe_type}
  mode: ${afe_mode}
  mic_num: 2                    # both microphones
  # input_format is left at `auto`: the stack derives the ESP-SR channel order
  # from the TDM slot map above, so it follows tdm_mic_slots/tdm_ref_slot.

  se_enabled: true              # dual-mic Speech Enhancement / BSS
  ns_enabled: true
  vad_enabled: true
  continuous_vad: true
  agc_enabled: false

  aec_filter_length: 4
  aec_nlp_level: normal
  memory_alloc_mode: more_psram

  task_core: 1
  task_priority: 5
  ringbuf_size: 8
  feed_task_core: ${afe_feed_task_core}
  feed_task_priority: 5
  feed_task_stack_size: 3072
  fetch_task_core: ${afe_fetch_task_core}
  fetch_task_priority: 5
  fetch_task_stack_size: 3072

  # Keep the AFE bridge buffers off the internal heap: worst-case HTTPS media +
  # TTS needs contiguous internal memory for API frame reads, TLS and I2S.
  feed_buf_in_psram: true       # ~6 KB hot scratch  on 2-mic + ref FD
  feed_ring_in_psram: true      # ~24 KB staging ring on 2-mic + ref FD
  fetch_ring_in_psram: true     # ~8 KB output ring

# -----------------------------------------------------------------------------
# The clean mic surface. This is the post-AFE stream: mono s16 @ 16 kHz. If the
# processor is enabled but unavailable the stack emits silence rather than
# silently falling back to raw mic audio.
#
# `microphone.mute` works exactly as on the stock path - the platform derives
# from microphone::Microphone and zero-fills every consumer's buffer - so the
# "Microphone Mute" switch in core.yaml needs no change.
# -----------------------------------------------------------------------------
microphone:
  - platform: esp_audio_stack
    id: ${mic_id}
    esp_audio_stack_id: audio_stack

speaker:
  # The physical sink. Replaces the stock path's i2s_audio speaker.
  - platform: esp_audio_stack
    id: hw_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000
    bits_per_sample: 16
    timeout: 1s
    buffer_duration: ${hw_speaker_buffer_duration}

  # Mixes the announcement and media pipelines into the one physical output.
  # Mono: the board has a single speaker (mono ES8311 + NS4150B). Identical in
  # shape to the stock path's mixer, and deliberately keeps the same ids so
  # core.yaml's ducking actions work unchanged - only the rates are pinned to
  # the 48 kHz bus and the tasks are moved to PSRAM stacks.
  - platform: mixer
    id: mixing_speaker
    output_speaker: hw_speaker
    num_channels: 1
    bits_per_sample: 16
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
        buffer_duration: 100ms
        sample_rate: 48000
        bits_per_sample: 16
        num_channels: 1
      - id: media_mixing_input
        timeout: never
        buffer_duration: 100ms
        sample_rate: 48000
        bits_per_sample: 16
        num_channels: 1

  # The mixer needs both inputs at one sample rate; these resample if needed.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    task_stack_in_psram: true
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 1
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    task_stack_in_psram: true
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 1

globals:
  # False only until the mic-gain default has been applied once on this device.
  - id: mic_gain_default_applied
    type: bool
    restore_value: yes
    initial_value: 'false'

script:
  - id: amp_idle_powerdown
    mode: restart
    then:
      - delay: ${amp_idle_delay}
      - switch.turn_off: amp_enable

number:
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    # NOT the stock path's "Mic gain (ES7210)". That was the ES7210's analog PGA
    # (0 to 37.5 dB); the analog gain is now compile-time (es7210_gain_db above,
    # applied to the reference slot as well, so it is not safe to expose as a
    # live control). This is digital trim applied AFTER the AFE.
    mic_gain:
      id: mic_gain_digital
      name: "Mic gain (digital)"
      icon: mdi:microphone-settings
      entity_category: config
      min_value: -20
      max_value: 30
    # The codec's own volume curve, floored at master_volume_min_db. The media
    # player's volume is a separate digital scale on its pipeline, so the AFE
    # thin config opens its volume_min/volume_max clamps to 0.0/1.0 and lets
    # this entity shape loudness - setting both would scale twice.
    master_volume:
      id: master_volume
      name: "Master Volume"
      speaker_id: hw_speaker

switch:
  - platform: esp_afe
    esp_afe_id: afe_processor
    aec:
      id: aec_switch
      name: "Echo Cancellation"
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON
    vad:
      id: vad_switch
      name: "Voice Activity Detector"
      icon: mdi:account-voice
      # GMF AFE only builds its VAD/wakeup internals if VAD is on when the
      # element opens, so keep it on across reboots and HA reconnects.
      restore_mode: ALWAYS_ON

binary_sensor:
  - platform: esp_afe
    esp_afe_id: afe_processor
    vad:
      name: "Voice Detected"
      id: voice_presence
      entity_category: diagnostic

sensor:
  # Bring-up instrument for the slot-map conflict documented at the top of this
  # file. Play music: the reference slot moves. Speak: the two mic slots move.
  # Whatever you observe, set tdm_mic_slots / tdm_ref_slot to match.
  #
  # The esp_audio_stack sensor platform defaults these to `diagnostic`, which
  # keeps them off the Overview dashboard; slot_sensor_category overrides that
  # so they are visible while you need them.
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    tdm_slot_levels:
      - slot: 0
        name: "TDM slot 0 level"
        entity_category: ${slot_sensor_category}
      - slot: 1
        name: "TDM slot 1 level"
        entity_category: ${slot_sensor_category}
      - slot: 2
        name: "TDM slot 2 level"
        entity_category: ${slot_sensor_category}
      - slot: 3
        name: "TDM slot 3 level"
        entity_category: ${slot_sensor_category}
